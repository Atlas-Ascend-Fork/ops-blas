# issue #875/#876：ldb 合法性校验与 alpha=0 清零足迹验证用例
#
# 列格式: m n batch side uplo transa diag alpha tag [ldb] [expect]
#   ldb    可选列：>0 时按该步长调用（覆盖紧致 ldb=m 等场景）；缺省或 0 表示默认 ldb=n
#   expect 可选列：1 表示期望被入参校验拒绝（ACLBLAS_STATUS_INVALID_VALUE）
#
# 用例说明（均无需输入数据文件）：
#   1) m=8, n=16, ldb=8（m<n 且紧致步长 ldb=m，旧校验误拒）+ alpha=0：
#      期望 SUCCESS，且测试程序断言整段 B 足迹 ((n-1)*ldb+m)*4 字节全部清零；
#   2) m=16, n=8, ldb=8（m>n 且 ldb<m，旧校验放行导致 kernel 按错误步长读写）：
#      期望被拒绝，返回 ACLBLAS_STATUS_INVALID_VALUE；
#   3) m=n=16 默认步长 + alpha=0：回归用例，期望 SUCCESS 且整段 B 清零。
#
# 运行方式（repo 根目录，先建 tag 目录供输出落盘）：
#   mkdir -p build/test tc_tight_ldb_8x16 tc_reject_ldb_lt_m_16x8 tc_alpha0_square_16
#   ./build/test/trsm_batched_test experimental/aclblasTrsmBatched/test/validation_cases.cfg
# 期望输出 "Kernel done: 3/3 passed"（exit 0）。
8 16 1 0 0 0 0 0 tc_tight_ldb_8x16 8 0
16 8 1 0 0 0 0 1.0 tc_reject_ldb_lt_m_16x8 8 1
16 16 1 0 0 0 0 0 tc_alpha0_square_16 0 0
